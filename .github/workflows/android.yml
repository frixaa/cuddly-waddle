name: Build WebWrapper APK

on:
  push:
    paths:
      - 'webwrapper-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.2'
          build-root-directory: webwrapper-app
          arguments: assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: WebWrapper-APK
          path: webwrapper-app/app/build/outputs/apk/release/*.apk
